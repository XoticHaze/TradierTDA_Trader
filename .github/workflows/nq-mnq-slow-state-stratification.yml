name: nq-mnq-slow-state-stratification

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        config: [h12_vol10, h24_vol05]
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Checkout exact research harness
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/XoticHaze/TextConverterToolbox.git harness
          git -C harness checkout --detach a6983519fd187fee306f1b8b23d00990ded96926
          test "$(git -C harness rev-parse HEAD)" = "a6983519fd187fee306f1b8b23d00990ded96926"

      - name: Checkout exact deep MNQ source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mbytes21/MNQ_DATA.git deep
          git -C deep checkout --detach fc5508e2c152938d6d9eb70a36b888ae26107176
          test "$(git -C deep rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"

      - name: Download frozen intraday NQ and 1999+ daily NQ
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source result
          curl --fail --location --retry 4 --retry-all-errors \
            'https://www.kaggle.com/api/v1/datasets/download/tgtanalytics/nq-futures-1min-bar-2022-2025' \
            -o source/nq-intraday.zip
          unzip -q source/nq-intraday.zip -d source/intraday
          mapfile -t csvs < <(find source/intraday -type f -iname '*.csv' -print)
          test "${#csvs[@]}" -eq 1
          cp "${csvs[0]}" source/nq-intraday.csv
          test "$(sha256sum source/nq-intraday.csv | awk '{print $1}')" = "1577e60a7feab411e49da7a56c7052a64738cd1757cfd60aa11fd783ff43b60b"
          curl --fail --location --retry 4 --retry-all-errors \
            'https://www.kaggle.com/api/v1/datasets/download/youneseloiarm/nasdaq-cme-future-nq' \
            -o source/nq-long.zip
          unzip -q source/nq-long.zip -d source/long
          test -f source/long/NQ_in_daily.csv

      - name: Install bounded dependencies
        run: python -m pip install --disable-pip-version-check -q pandas numpy scikit-learn tzdata

      - name: Normalize exact intraday NQ source
        shell: bash
        run: |
          set -euo pipefail
          cd harness
          python -m research.nq_cc0_corpus_audit \
            --input ../source/nq-intraday.csv \
            --output-json ../result/nq-audit.json \
            --output-normalized ../result/nq-normalized.csv.gz

      - name: Execute state stratification without gating
        shell: bash
        env:
          CONFIG_KEY: ${{ matrix.config }}
        run: |
          set -uo pipefail
          cd harness
          python -m research.nq_mnq_slow_state_stratification \
            --config-key "$CONFIG_KEY" \
            --deep-root ../deep/plaintext_csv \
            --nq-normalized ../result/nq-normalized.csv.gz \
            --nq-daily ../source/long/NQ_in_daily.csv \
            --output "../result/${CONFIG_KEY}.json" \
            2>&1 | tee "../result/${CONFIG_KEY}.log"
          rc=${PIPESTATUS[0]}
          echo "STRATIFICATION_EXIT_CODE=$rc" | tee -a "../result/${CONFIG_KEY}.log"
          exit "$rc"

      - name: Upload diagnostic metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nq-mnq-slow-state-${{ matrix.config }}
          path: |
            result/${{ matrix.config }}.json
            result/${{ matrix.config }}.log
          if-no-files-found: error
          retention-days: 30

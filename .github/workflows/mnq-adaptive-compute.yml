name: mnq-adaptive-compute

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact public research harness
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/XoticHaze/TextConverterToolbox.git harness
          git -C harness checkout --detach 951f63d519bdc8ac58175dbe21230744ecde5397
          test "$(git -C harness rev-parse HEAD)" = "951f63d519bdc8ac58175dbe21230744ecde5397"
          test -f harness/research/mnq_adaptive_walkforward.py
          echo 'HARNESS_PIN=PASS'
      - name: Checkout exact deep MNQ source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/mbytes21/MNQ_DATA.git deep
          git -C deep checkout --detach fc5508e2c152938d6d9eb70a36b888ae26107176
          test "$(git -C deep rev-parse HEAD)" = "fc5508e2c152938d6d9eb70a36b888ae26107176"
          echo 'DEEP_PIN=PASS'
      - name: Install bounded dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check -q pandas numpy scikit-learn
      - name: Execute exact adaptive walk-forward
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p result
          cd harness
          python -m research.mnq_adaptive_walkforward \
            --deep-root ../deep/plaintext_csv \
            --output ../result/mnq-adaptive-walkforward.json
      - name: Upload metrics only
        uses: actions/upload-artifact@v4
        with:
          name: mnq-adaptive-walkforward-results
          path: result/mnq-adaptive-walkforward.json
          if-no-files-found: error
          retention-days: 14
